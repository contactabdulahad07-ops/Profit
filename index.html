<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Falak ❤️</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Animated Background -->
<div class="background"></div>

<!-- Floating Hearts -->
<div class="hearts"></div>

<!-- ================= PASSWORD SCREEN ================= -->

<section id="passwordScreen" class="screen active">

<div class="glass">

<div class="lock">🔒</div>

<h1>Private Birthday Surprise</h1>

<p>Enter Password To Continue</p>

<input
type="password"
id="password"
placeholder="Enter Password">

<button id="unlockBtn">
Unlock ❤️
</button>

<p id="error"></p>

</div>

</section>

<!-- ================= WELCOME SCREEN ================= -->

<section id="welcomeScreen" class="screen">

<div class="glass">

<h1>

🎂 Happy Birthday

<br>

<span>Falak My Love ❤️</span>

</h1>

<div class="teddyBox">

<div class="teddy">

🩶🐻

<p>Me</p>

</div>

<div class="cake">

🎂

</div>

<div class="teddy">

🤍🐻

<p>Falak</p>

</div>

</div>

<button id="surpriseBtn">

🎁 Surprise

</button>

</div>

</section>
<!-- ================= HEART GAME ================= -->

<section id="gameScreen" class="screen">

<div class="glass">

<h1>❤️ Catch The Hearts ❤️</h1>

<p>Collect 10 Hearts To Unlock Your Surprise</p>

<div id="gameArea"></div>

<h2 id="score">0 / 10</h2>

</div>

  </section>
  <!-- ================= CAKE SCREEN ================= -->

<section id="cakeScreen" class="screen">

<div class="glass">

<h1>🎂 Cut The Cake 🎂</h1>

<p>Click the knife to cut the birthday cake ❤️</p>

<div class="cakeArea">

<div id="candles">
🕯️ 🕯️ 🕯️
</div>

<div id="cake">
🎂
</div>

</div>

<button id="cutCakeBtn">
🔪 Cut Cake
</button>

</div>

  </section>
<script src="script.js"></script>

</body>
</html>
