<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Falak ❤️</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Animated Background -->
<div class="background"></div>

<!-- Floating Hearts -->
<div class="hearts"></div>

<!-- ================= PASSWORD SCREEN ================= -->

<section id="passwordScreen" class="screen active">

<div class="glass">

<div class="lock">🔒</div>

<h1>Private Birthday Surprise</h1>

<p>Enter Password To Continue</p>

<input
type="password"
id="password"
placeholder="Enter Password">

<button id="unlockBtn">
Unlock ❤️
</button>

<p id="error"></p>

</div>

</section>

<!-- ================= WELCOME SCREEN ================= -->

<section id="welcomeScreen" class="screen">

<div class="glass">

<h1>

🎂 Happy Birthday

<br>

<span>Falak My Love ❤️</span>

</h1>

<div class="teddyBox">

<div class="teddy">

🩶🐻

<p>Me</p>

</div>

<div class="cake">

🎂

</div>

<div class="teddy">

🤍🐻

<p>Falak</p>

</div>

</div>

<button id="surpriseBtn">

🎁 Surprise

</button>

</div>

</section>

<script src="script.js"></script>

</body>
</html>
